id: monocle2py.load_hsmm_fpkm
import_path: monocle2py.load_hsmm_fpkm
kind: function
signature: load_hsmm_fpkm()
purpose: load the HSMM Trapnell 2014 tutorial dataset
description: 'Load the HSMM (Trapnell 2014) FPKM expression matrix from the Zenodo

  fixture bundle (cached locally on first use). Used by tutorial

  V2_1_HSMM as the canonical Monocle2 demo. ``X`` is FPKM; build a CDS

  with ``new_cell_dataset(..., expression_family=tobit(lower=0.1))``

  and run ``relative2abs`` before NB analysis.

  '
parameters: []
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: AnnData; kind=value
requires: []
writes: []
examples:
- fpkm = monocle2py.load_hsmm_fpkm()
failure_fixes:
- when: network error / missing fixture
  suggest:
  - First call downloads from Zenodo; check internet access and ~/.cache/biobabel.
related:
- monocle2py.new_cell_dataset
- monocle2py.relative2abs
- 'tested_on: monocle2py@2.9.0'
