id: monocle2py.new_cell_dataset
import_path: monocle2py.new_cell_dataset
kind: function
signature: new_cell_dataset(cell_data, pheno_data=None, feature_data=None, lower_detection_limit=0.1, expression_family=None)
purpose: construct a Monocle2 AnnData; initialize CellDataSet state on an existing AnnData
description: 'Mirror of R''s ``newCellDataSet``: returns an AnnData with

  ``uns[''monocle2'']`` initialised (expression family + lower detection

  limit) and ``obs[''Size_Factor'']`` filled with NaN (later set by

  ``estimate_size_factors``). Accepts either a raw matrix

  (``cell_data`` is cells x genes) **or** an existing AnnData (in which

  case it just annotates the Monocle2 state slots without rebuilding).

  Default expression family is ``negbinomial_size`` (a Poisson-degenerate

  NB matching R''s ``VGAM::negbinomial.size()``); pass ``tobit(lower=0.1)``

  for log-scale FPKM input that will go through ``relative2abs``.

  '
parameters:
- name: cell_data
  type: np.ndarray | spmatrix | pd.DataFrame | AnnData
  required: true
  description: Cells x genes. Pass AnnData to reuse it in place.
- name: pheno_data
  type: pd.DataFrame | None
  required: false
  default: null
  description: Cell metadata (must have len == n_cells).
- name: feature_data
  type: pd.DataFrame | None
  required: false
  default: null
  description: Gene metadata. A 'gene_short_name' column is expected for plotting.
- name: lower_detection_limit
  type: float
  required: false
  default: 0.1
- name: expression_family
  type: ExpressionFamily | None
  required: false
  default: null
  description: Defaults to negbinomial_size(). Use tobit() for log-FPKM.
mutates: execution_class=adata_mutation; mutates input object in place; returns_kind=same_object
returns: AnnData; kind=same_object
requires: []
writes:
- adata.obs.Size_Factor
- adata.uns.monocle2
examples:
- adata = monocle2py.new_cell_dataset(counts, pheno_data=obs, feature_data=var)
- adata = monocle2py.new_cell_dataset(fpkm, expression_family=monocle2py.tobit(lower=0.1))
failure_fixes:
- when: 'TypeError: cell_data must be a NumPy ndarray, scipy sparse matrix, pandas DataFrame, or AnnData'
  suggest:
  - Cast your input via ``np.asarray()`` or ``ad.AnnData(...)`` first.
- when: 'ValueError: obs data length N does not match cell_data axis length M'
  suggest:
  - pheno_data row count must equal n_cells; feature_data row count must equal n_genes.
- when: 'UserWarning: featureData must contain a column verbatim named ''gene_short_name'''
  suggest:
  - Add a 'gene_short_name' column to var (gene symbols). Plotting helpers and label_by_short_name fall back to var_names without it.
related:
- monocle2py.detect_genes
- monocle2py.estimate_size_factors
- monocle2py.relative2abs
- 'tested_on: monocle2py@2.9.0'
