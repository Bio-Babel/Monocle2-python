[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monocle2py"
version = "0.1.0"
description = "Python port of the R monocle2 package"
requires-python = ">=3.10"
license = "Artistic-2.0"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "python-igraph>=0.10",
    "ddrtree",
    "ggplot2_py",
    "pheatmap_py",
    "grid_py",
    "gtable_py",
    "scales_py",
    "ggrepel_py",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["monocle2py"]

[tool.hatch.build.targets.sdist]
include = ["monocle2py", "tutorials", "tests", "validation", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
